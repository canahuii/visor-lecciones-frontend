    <body>
        
        <script> 
        let nombre = 'juan';

        </script>
        <h1>este es el segundo script </h1>
        
        <script>
            let valor1;
            let valor2;

            valor1 = prompt('ingrese el primer numeri' , 10);
            valor2 = prompt('ingrese el segundo numero: ', 20);

            let suma = parseInt(valor1) + parseInt(valor2);
            let producto = parseInt(valor1) * parseInt(valor2);

            document.write(`<p>el resultado de suma ${valor1} con el valor ${valor2} es : ${suma}. </p>`)
            document.write(`El resultado de multiplicar ${valor1} por ${valor2} es : ${producto} `); 
        </script>

    </body>
