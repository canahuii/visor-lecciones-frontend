<!DOCTYPE html> <html>
    <head>
        <title>Dia 20 aprendiendo sobre javaScript</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="estilo_html.css" type="text/css"> 
    </head>
    <body>
        <h1>leccion 1 del dia: repaso del dia 20</h1>
        <div>
            <p>
                <em>Para mas informacion visita: <a href="https://www.tutorialesprogramacionya.com/javascriptya/temarios/descripcion.php?inicio=30&cod=41">javaScript orientado a objetos</a></em>
                <br><br>            
            </p>
            <script>
                function cliente(nombre, saldo)
                {
                    this.nombre = nombre;
                    this.saldo = saldo;
                    this.depositar = depositar;
                    this.extraer = extraer;
                }

                function depositar(dinero)
                {
                    this.saldo += dinero;
                }

                function extraer(dinero)
                {
                     this.saldo -= dinero;
                }

                let cliente1;

                cliente1 = new cliente('diego' , 1200)
                document.write("nombre del cliente: " + cliente1.nombre + "<br>");
                document.write("saldo actual: " + cliente1.saldo + "<br>");
                cliente1.depositar(1200)
                document.write("su saldo despues de depositar 1200 es: " + cliente1.saldo + "<br>") 
                cliente1.extraer(1000);
                document.write("su saldo despues de extraer 1000 es de: " + cliente1.saldo + "<br>");     
            </script>
        </div>
    </body>
</html>
