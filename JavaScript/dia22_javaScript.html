<!DOCTYPE html> <html>
    <head>
        <title>Dia 22 apendiendo javaScript </title>

    <body>
        <h1>Leccion 1 del dia: definicion de varias clases</h1>
        <div>
            <script>
                //clase numero quiniela ************************
                function numeroQuiniela(nombre) 
                {
                    this.nombre = nombre;
                    this.cargarNumero = function()
                    {
                        this.numero = parseInt(prompt("que numero de quiniela quiere "+ this.nombre + " ? " ))
                    }
                    this.verificarSiGano = function(num)
                    {
                        if(this.numero == num)
                        {
                            return true;
                        }
                        else
                        {
                            return false;
                        }
                    }
                }

                //Clase bolillero
                function Bolillero()
                {
                    this.numero = -1;
                    this.sortear = function()
                    {
                        this.numero = parseInt(Math.random() * 10 )  +1;
                    }
                }

                //bloque principal
                let numeroquiniela1;
                numeroquiniela1 = new numeroQuiniela("juan");
                numeroquiniela1.cargarNumero();
                let numeroquiniela2 = new numeroQuiniela("ana");
                numeroquiniela2.cargarNumero();
                
                let bolillero = new Bolillero()
                bolillero.sortear();

                document.writeln("numero sorteado: " + bolillero.numero + "<br>");
                document.writeln(numeroquiniela1.nombre+" eligio "+numeroquiniela1.numero +"<br>");
                document.writeln(numeroquiniela2.nombre + " eligio el numero " + numeroquiniela2.numero+"<br>");
                if(numeroquiniela1.verificarSiGano(bolillero.numero))
                {
                    document.writeln(numeroquiniela1.nombre +" ha ganado" + "<br>")
                }

                if (numeroquiniela2.verificarSiGano(bolillero.numero))
                {
                    document.writeln(numeroquiniela2.nombre + " ha ganado <br>");
                }
            </script>
        </div>
