<!DOCTYPE html>
<html>
<head>
  <title>Ejemplo de Tabla</title>
  <style>
    table {
      width: 80%;              /* ancho de la tabla */
      border-collapse: collapse; /* une los bordes */
        margin: 20px auto;       /* centra la tabla */
    }

    th, td {
      border: 1px solid #333;  /* borde de cada celda */
      padding: 10px;           /* espacio interno */
      text-align: center;      /* alineación del texto */
    }

    th {
      background-color: #4CAF50; /* color de fondo encabezado */
      color: white;              /* color del texto */
    }

    tr:nth-child(even) {
      background-color: #f2f2f2; /* filas pares con fondo gris */
    }

    tr:hover {
      background-color: #ddd;    /* efecto al pasar el mouse */
    }
  </style>
</head>
<body>
  <h2>Tabla de Ejemplo</h2>
  <table>
    <tr>
      <th>Nombre</th>
      <th>Edad</th>
      <th>Ciudad</th>
    </tr>
    <tr>
      <td>Ana</td>
      <td>25</td>
      <td>Guatemala</td>
    </tr>
    <tr>
      <td>Carlos</td>
      <td>30</td>
      <td>Antigua</td>
    </tr>
    <tr>
      <td>María</td>
      <td>28</td>
      <td>Quetzaltenango</td>
    </tr>
    <tr>
        <td>kyis</td>
    </tr>
    <tr>
        <td>pero</td>
    </tr>
  </table>
</body>
</html>
